server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # The shell names a content-hashed bundle, so a cached copy pins the whole old app.
  # Without an explicit policy a browser caches it heuristically and never asks again.
  location = /index.html {
    add_header Cache-Control "no-store" always;
  }

  # Safe to keep forever: the filename changes whenever the contents do.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
